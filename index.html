<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC PREMIUM HACK</title>
    <style>
        /* General Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Game Background Iframe */
        #gameBackground {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Only Password Login Screen Overlay */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 11, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .login-card h2 {
            color: #ffd700;
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .login-card input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .login-card input:focus {
            border-color: #ffd700;
        }

        .login-card button {
            width: 100%;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-card button:hover {
            transform: scale(1.02);
        }

        /* Floating Draggable Premium Hack Tool */
        #hackTool {
            display: none; /* Hidden till Login */
            position: absolute;
            top: 20%;
            left: 5%;
            width: 350px;
            background: rgba(20, 20, 35, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            overflow: hidden;
        }

        /* Header (Drag area + Hide Button) */
        .hack-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: move; /* Indicates it can be moved */
        }

        .hide-btn {
            background: rgba(255, 50, 50, 0.25);
            border: 1px solid #ff3344;
            color: #ff5555;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .tool-title {
            color: #ffd700;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        /* Main Panel Layout (Split Screen) */
        .workspace {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Left Side (Timer & Output) */
        .left-panel {
            flex: 1.2;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .period-txt {
            font-size: 11px;
            color: #bbb;
            margin-bottom: 3px;
        }
        .period-num {
            color: #fff;
            font-weight: bold;
        }

        .timer-display {
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            color: #00ffff;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .prediction-box {
            width: 100%;
            height: 60px;
            background: rgba(0,0,0,0.5);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        /* Dynamic Big/Small Colors */
        .status-big {
            color: #00ff77 !important; /* Green */
            border-color: #00ff77 !important;
            background: rgba(0, 255, 119, 0.12) !important;
            text-shadow: 0 0 15px #00ff77;
        }

        .status-small {
            color: #ff3344 !important; /* Red */
            border-color: #ff3344 !important;
            background: rgba(255, 51, 68, 0.12) !important;
            text-shadow: 0 0 15px #ff3344;
        }

        /* Right Side (History List) */
        .right-panel {
            flex: 0.8;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .right-panel h3 {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }

        .history-list {
            list-style: none;
            max-height: 120px;
            overflow-y: auto;
            font-size: 11px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 5px;
            margin-bottom: 4px;
        }

        /* Stats Layer (Win / Loss) */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            background: rgba(0,0,0,0.2);
        }
        .win-txt { color: #00ff77; }
        .loss-txt { color: #ff3344; }

        /* Telegram & Game Bottom Footer */
        .footer-links {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0,0,0,0.4);
        }
        .btn-link {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }
        .tg-btn { background: #229ED9; }

        /* Floating RC Unhide Logo Icon Trigger */
        #rcUnhideLogo {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #7000ff, #ff0055);
            border: 2px solid #ffd700;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 0 15px rgba(255,0,85,0.5);
            display: none;
        }

        /* Error Text */
        .err-msg {
            color: #ff3344;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <iframe id="gameBackground" src="https://deshclub2.com/#/register?invitationCode=15215140937"></iframe>

    <div id="rcUnhideLogo" onclick="showHackPanel()">RC PREMIUM</div>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>RC PREMIUM HACK</h2>
            <input type="password" id="passKey" placeholder="Enter Password">
            <button onclick="verifyAccess()">LOGIN</button>
            <div class="err-msg" id="errText">Wrong Password! Try Again.</div>
        </div>
    </div>

    <div id="hackTool">
        
        <div class="hack-header" id="dragHeader">
            <button class="hide-btn" onclick="hideHackPanel()">HIDE</button>
            <div class="tool-title">RC PRIMIUM HACK</div>
            <div></div>
        </div>

        <div class="workspace">
            <div class="left-panel">
                <div class="period-txt">Period: <span class="period-num" id="displayPeriod">---------</span></div>
                <div class="timer-display" id="displayTimer">30s</div>
                <div class="prediction-box" id="predictionText">WAITING</div>
            </div>

            <div class="right-panel">
                <h3>History</h3>
                <ul class="history-list" id="historyFeed">
                    </ul>
            </div>
        </div>

        <div class="stats-bar">
            <span class="win-txt">WIN : <span id="wCount">10</span></span>
            <span class="loss-txt">LOSS : <span id="lCount">1</span></span>
        </div>

        <div class="footer-links">
            <a href="https://t.me/+YVLg9VzWToY1N2M1" target="_blank" class="btn-link tg-btn">📱 JOIN TELEGRAM CHANNEL</a>
        </div>

    </div>

    <script>
        // Core Security Credentials Config
        const SECRET_KEY = "RC";
        let lastLoggedPeriod = "";

        // Verification routing logic
        function verifyAccess() {
            const inputVal = document.getElementById('passKey').value;
            const error = document.getElementById('errText');

            if (inputVal === SECRET_KEY) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('hackTool').style.display = 'block';
                initiateHackCore();
            } else {
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 2500);
            }
        }

        // Hide and Unhide Display Switch Mechanics
        function hideHackPanel() {
            document.getElementById('hackTool').style.display = 'none';
            document.getElementById('rcUnhideLogo').style.display = 'block';
        }

        function showHackPanel() {
            document.getElementById('rcUnhideLogo').style.display = 'none';
            document.getElementById('hackTool').style.display = 'block';
        }

        // Draggable Mobile / Desktop Logic Implementation
        const floatingBox = document.getElementById("hackTool");
        const dragHandle = document.getElementById("dragHeader");

        let activeDrag = false;
        let currentX, currentY, initialX, initialY;
        let xOffset = 0, yOffset = 0;

        // Desktop Events
        dragHandle.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", dragProcess);
        document.addEventListener("mouseup", dragStop);

        // Mobile Touch Events
        dragHandle.addEventListener("touchstart", dragStart, { passive: false });
        document.addEventListener("touchmove", dragProcess, { passive: false });
        document.addEventListener("touchend", dragStop);

        function dragStart(e) {
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
            if (e.target === dragHandle || dragHandle.contains(e.target)) {
                activeDrag = true;
            }
        }

        function dragProcess(e) {
            if (activeDrag) {
                if (e.type === "touchmove") {
                    e.preventDefault(); // Prevents web content scrolling while dragging
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }
                xOffset = currentX;
                yOffset = currentY;
                floatingBox.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        function dragStop() {
            initialX = currentX;
            initialY = currentY;
            activeDrag = false;
        }

        // Original Algorithmic Hashing Logic Processing
        function advancedSeed(e) {
            return e = (3735928559 ^ e) + (e << 4), e ^= e >> 10, e += e << 7, e ^= e >> 13, Math.abs(e);
        }

        function generateResult(periodId) {
            const t = advancedSeed(Number(periodId)) % 10;
            let size = t >= 5 ? "BIG" : "SMALL";
            let color = "";
            
            if (0 === t) color = "RED + VIOLET";
            else if (5 === t) color = "GREEN + VIOLET";
            else if ([2, 4, 6, 8].includes(t)) color = "RED";
            else color = "GREEN";

            return { number: t, size: size, color: color };
        }

        // Dynamic System Clock Synchronization 30s-0s Loop Engine
        function initiateHackCore() {
            setInterval(() => {
                const liveTime = new Date();
                const seconds = liveTime.getSeconds();

                // Generate strict descending loop from 30 to 0
                let countdown = 30 - (seconds % 30);
                if (countdown === 30) countdown = 0; 
                
                document.getElementById('displayTimer').innerText = countdown + "s";

                // Period generation based on timezone timestamp criteria
                const yr = liveTime.getFullYear();
                const mt = String(liveTime.getMonth() + 1).padStart(2, '0');
                const dt = String(liveTime.getDate()).padStart(2, '0');
                
                const dayMinutes = (liveTime.getHours() * 60) + liveTime.getMinutes();
                const sequentialInterval = Math.floor(seconds / 30) + (dayMinutes * 2);
                
                const livePeriodID = `${yr}${mt}${dt}30${String(sequentialInterval).padStart(4, '0')}`;
                document.getElementById('displayPeriod').innerText = livePeriodID;

                // Fire state change prediction calculation
                if (livePeriodID !== lastLoggedPeriod) {
                    lastLoggedPeriod = livePeriodID;
                    renderPrediction(livePeriodID);
                }
            }, 1000);
        }

        function renderPrediction(periodId) {
            const textPanel = document.getElementById('predictionText');
            const logsBox = document.getElementById('historyFeed');
            
            const calc = generateResult(periodId);
            
            // Logic Reversed: BIG becomes SMALL, SMALL becomes BIG
            const displaySize = calc.size === "BIG" ? "SMALL" : "BIG";
            
            // Clean interface classes
            textPanel.className = "prediction-box";
            textPanel.innerText = displaySize;

            // Apply direct color criteria switches (Updated for new logic)
            if (displaySize === "BIG") {
                textPanel.classList.add("status-big");
            } else {
                textPanel.classList.add("status-small");
            }

            // Append item output strings to history tab layout 
            const entryRow = document.createElement('li');
            entryRow.className = "history-item";
            
            const cutPeriod = periodId.slice(-4);
            const coloredStatus = displaySize === "BIG" ? `<span style="color:#00ff77; font-weight:bold;">BIG</span>` : `<span style="color:#ff3344; font-weight:bold;">SMALL</span>`;
            
            entryRow.innerHTML = `<span>#${cutPeriod}</span> <span>${coloredStatus}</span>`;
            
            // Push inside array stack
            logsBox.insertBefore(entryRow, logsBox.firstChild);

            // Clear old history overflow logs
            if (logsBox.children.length > 5) {
                logsBox.removeChild(logsBox.lastChild);
            }
        }
    </script>
</body>
